<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Practice Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Outpatient PT Practice Manager</h1>
      <p>Simple single-owner workflow for patients, appointments, and revenue tracking.</p>

      <section class="card">
        <h2>Dashboard</h2>
        <div id="summary" class="summary"></div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Add Patient</h2>
          <form id="patient-form">
            <label>
              Name
              <input required name="name" maxlength="80" />
            </label>
            <label>
              Phone
              <input required name="phone" maxlength="20" />
            </label>
            <label>
              Condition
              <input required name="condition" maxlength="120" />
            </label>
            <button type="submit">Save Patient</button>
          </form>

          <h3>Patients</h3>
          <ul id="patient-list"></ul>
        </article>

        <article class="card">
          <h2>Log Appointment</h2>
          <form id="appointment-form">
            <label>
              Patient
              <select required name="patientId" id="patient-select"></select>
            </label>
            <label>
              Date
              <input required type="date" name="date" />
            </label>
            <label>
              Visit Fee ($)
              <input required type="number" min="0" step="0.01" name="fee" />
            </label>
            <button type="submit">Save Appointment</button>
          </form>

          <h3>Appointments</h3>
          <ul id="appointment-list"></ul>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
